name: Workflow State Audit

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    name: Report workflow states without changing them
    runs-on: ubuntu-latest
    steps:
      - name: List inactive workflows
        uses: actions/github-script@v7
        with:
          script: |
            const workflows = await github.paginate(
              github.rest.actions.listRepoWorkflows,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            const inactive = workflows.filter((workflow) => workflow.state !== "active");
            core.summary.addHeading("Workflow state audit");
            core.summary.addRaw("Total workflows: " + workflows.length + "\n\n");
            core.summary.addRaw("Inactive workflows: " + inactive.length + "\n\n");
            if (inactive.length > 0) {
              core.summary.addTable([
                [{ data: "Workflow", header: true }, { data: "State", header: true }, { data: "ID", header: true }],
                ...inactive.map((workflow) => [workflow.name, workflow.state, String(workflow.id)])
              ]);
            }
            core.summary.addRaw("Read-only report. This workflow never enables, disables, or dispatches workflows.\n");
            await core.summary.write();
