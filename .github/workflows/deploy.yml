name: Deploy VCL Instances

# Automatic push deployments are paused; use manual dispatch after review.
on:
  workflow_dispatch:
    inputs:
      vcl:
        description: "VCL to deploy (fire|ocean|neural|void|prime|all)"
        type: choice
        options:
          - fire
          - ocean
          - neural
          - void
          - prime
          - all
        default: "all"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - vcl: fire
            stream_secret: STREAM_KEY_FIRE
          - vcl: ocean
            stream_secret: STREAM_KEY_OCEAN
          - vcl: neural
            stream_secret: STREAM_KEY_NEURAL
          - vcl: void
            stream_secret: STREAM_KEY_VOID
          - vcl: prime
            stream_secret: STREAM_KEY_PRIME
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy evez-vcl-${{ matrix.vcl }}
        if: >
          github.event.inputs.vcl == matrix.vcl ||
          github.event.inputs.vcl == 'all'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          STREAM_KEY: ${{ secrets[matrix.stream_secret] }}
        run: |
          APP="evez-vcl-${{ matrix.vcl }}"
          STREAM_KEY_NAME="${{ matrix.stream_secret }}"
          if [ -z "$STREAM_KEY" ]; then
            echo "Missing required stream secret: $STREAM_KEY_NAME" >&2
            exit 1
          fi
          flyctl apps create "$APP" --org evez 2>/dev/null || true
          flyctl secrets set \
            VCL_ID="${{ matrix.vcl }}" \
            SUPABASE_URL="$SUPABASE_URL" \
            SUPABASE_SERVICE_KEY="$SUPABASE_SERVICE_KEY" \
            YOUTUBE_TOKEN="$YOUTUBE_TOKEN" \
            GROQ_API_KEY="$GROQ_API_KEY" \
            "$STREAM_KEY_NAME=$STREAM_KEY" \
            --app "$APP"
          CONFIG="fly-${{ matrix.vcl }}.toml"
          sed -E "s/^app = \".*\"$/app = \"$APP\"/" fly.toml > "$CONFIG"
          grep -Fx "app = \"$APP\"" "$CONFIG"
          flyctl deploy --remote-only --config "$CONFIG"
